[workspace]
resolver = "2"
members = [
    "crates/mcp-core",
    "crates/mcp-parser",
    "crates/mcp-search",
    "crates/mcp-transport",
    "crates/mcp-web-search",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Vitaly Kuzyaev <vitkuz573@gmail.com>"]
license = "MIT"
repository = "https://github.com/vitkuz573/mcp-web-search"
description = "Enterprise MCP server for unified web search across multiple search engines"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
reqwest-middleware = "0.4"
reqwest-retry = "0.7"

# HTML parsing
scraper = "0.22"
select = "0.6"
ego-tree = "0.8"

# MCP protocol
rmcp = { version = "2.2", features = ["server", "client", "transport-child-process", "macros", "schemars"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Error handling
thiserror = "2"
anyhow = "1"
eyre = "0.6"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Utils
chrono = { version = "0.4", features = ["serde"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"
async-compression = { version = "0.4", features = ["tokio", "gzip", "brotli"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
pin-project-lite = "0.2"

# Config
figment = { version = "0.10", features = ["toml", "env", "json"] }

# Cache
moka = { version = "0.12", features = ["future"] }

# Regex
regex = "1"

# URL encoding
urlencoding = "2"

# Base64
base64 = "0.22"

# Dev utilities
pretty_assertions = "1"
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"
wiremock = "0.6"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.profiling]
inherits = "release"
debug = true
